name: CodeQL

# Replaces GitHub's default code-scanning setup, which could not be tuned:
#
#   * it re-analysed Swift on every docs-only change (46 minutes for a one-line
#     shell script edit),
#   * it had no concurrency control, so three pushes to a branch left three
#     46-minute analyses running in parallel — for a PR that had already been
#     merged,
#   * and because Swift analysis needs a macOS runner, those runs occupied the
#     macOS pool a public repo gets and left an actual release queued behind
#     them for the better part of an hour.
#
# Same coverage (Swift + Actions, default query suite), scoped so it runs when
# it can find something.

on:
  push:
    branches: [main]
    # Kept in step with the pull_request list below — GitHub Actions does not
    # support YAML anchors, so the two have to be edited together.
    paths-ignore:
      # Nothing here is analysed by either language, and the Release workflow
      # commits the appcast back to main on every release.
      - '**/*.md'
      - docs/**
      - assets/**
      - screenshots/**
      - appcast.xml
      - .github/ISSUE_TEMPLATE/**
      - .github/upstream/**
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - docs/**
      - assets/**
      - screenshots/**
      - appcast.xml
      - .github/ISSUE_TEMPLATE/**
      - .github/upstream/**
      - LICENSE
  schedule:
    # Mondays at 05:00 UTC — catches newly published CodeQL queries finding
    # something in code nobody has touched since the last push.
    - cron: '0 5 * * 1'

# A new push supersedes the analysis in flight for the same ref. Never cancel
# on main or on the schedule: those results are what the security dashboard
# shows for the default branch.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must be workflow-level, not per-step: CodeQL's init step configures the
  # Swift extractor against whatever Xcode it sees, and the runner's default is
  # a different build (17E188) from the pinned one (17E202). With only the
  # build step pinned, the tracer looked for a Metal toolchain belonging to the
  # other Xcode and the analysis build died with "cannot execute tool 'metal'".
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      # Only the analyze job needs to write findings.
      security-events: write
      # Lets CodeQL correlate alerts with the workflow runs that produced them.
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift has to be compiled to be analysed, and the app only builds on
          # macOS — this is the expensive half.
          - language: swift
            runner: macos-26
            build-mode: manual
            timeout: 60
          # Workflow files: no build, so this is seconds on a Linux runner.
          - language: actions
            runner: ubuntu-latest
            build-mode: none
            timeout: 15

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # No `queries:` — that leaves the default suite, which is what the
          # previous setup ran, so this change alters scheduling and nothing
          # about coverage. `security-extended` is the knob if we ever want
          # more, at the cost of a longer run and more low-severity noise.

      # Same dependency cache the CI build uses — the analysis build otherwise
      # re-clones Sparkle, SwiftTerm, Citadel and swift-nio from scratch.
      - name: Cache resolved packages
        if: matrix.language == 'swift'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-xcode-${{ runner.os }}-

      # An explicit build rather than autobuild: autobuild guesses a scheme, and
      # a wrong guess analyses a subset of the app without saying so.
      # SwiftTerm compiles a Metal shader, and on macos-26 the Metal toolchain
      # is an on-demand MobileAsset rather than part of Xcode. Every job gets a
      # fresh VM: the CI build's runner happens to have the asset mounted, this
      # one does not, and the traced build then resolves `metal` inside
      # XcodeDefault.xctoolchain where it does not exist. Requesting it puts the
      # asset in place; harmless when it is already there.
      #
      # This needs the workflow-level DEVELOPER_DIR above — an earlier attempt
      # ran against the runner's default Xcode and died fetching a catalog for
      # the wrong build (17E188 vs the pinned 17E202).
      - name: Ensure the Metal toolchain is available
        if: matrix.language == 'swift'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build Gantry for analysis
        if: matrix.language == 'swift'
        run: |
          xcodebuild \
            -project Gantry.xcodeproj \
            -scheme Gantry \
            -configuration Debug \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/SourcePackages" \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
