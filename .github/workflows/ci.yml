name: CI

on:
  push:
    branches: [main]
    # Kept in step with the pull_request list below — GitHub Actions does not
    # support YAML anchors, so the two have to be edited together.
    paths-ignore:
      # The Release workflow commits the appcast back to main, and
      # release-please owns the changelog — neither is worth a macOS rebuild.
      - appcast.xml
      - CHANGELOG.md
      # Nothing below feeds the build. A change touching only these skips CI;
      # a change touching one of them *and* any source file still runs it.
      - '**/*.md'
      - docs/**
      - assets/**
      - screenshots/**
      - .github/ISSUE_TEMPLATE/**
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/upstream/**
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore:
      - appcast.xml
      - CHANGELOG.md
      - '**/*.md'
      - docs/**
      - assets/**
      - screenshots/**
      - .github/ISSUE_TEMPLATE/**
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/upstream/**
      - LICENSE

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The xcode-27 image (public preview) has the macOS 27 SDK that the macOS 27
  # features need. Pin the stable Xcode for reproducible builds.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  build:
    name: Build app
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Gantry pulls its dependencies (Sparkle, SwiftTerm, Citadel, swift-nio,
      # swift-crypto…) from git on every build. Cloning them again each run is
      # the slowest part of a cold build and none of it changes unless
      # Package.resolved does.
      - name: Cache resolved packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/SourcePackages
          key: spm-xcode27-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-xcode27-${{ runner.os }}-

      - name: Build Gantry (Release)
        run: |
          xcodebuild \
            -project Gantry.xcodeproj \
            -scheme Gantry \
            -configuration Release \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/SourcePackages" \
            build \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: Unit tests
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [AppCore, DockerKit, GantryMCP, GantryShared, SSHKit]
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Cache only the fetched dependencies. A restored build folder from
      # another branch breaks clang dependency scanning on Xcode 27.
      - name: Cache the package dependencies
        uses: actions/cache@v6
        with:
          path: |
            Packages/${{ matrix.package }}/.build/repositories
            Packages/${{ matrix.package }}/.build/checkouts
          key: spm-deps-xcode27-${{ matrix.package }}-${{ runner.os }}-${{ hashFiles(format('Packages/{0}/Package.resolved', matrix.package)) }}
          restore-keys: |
            spm-deps-xcode27-${{ matrix.package }}-${{ runner.os }}-

      - name: Test ${{ matrix.package }}
        # Live tests are gated with .enabled(if:) on the presence of a local
        # Docker socket / SSH test host, neither of which exists on CI, so they
        # are skipped rather than executed.
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  localization:
    name: Localization catalogs
    # Only Python is needed, so this job runs on Linux and finishes in seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check the String Catalogs
        run: python3 scripts/check-localization.py
